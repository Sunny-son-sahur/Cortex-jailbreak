<main class="subpage" id="main">
  <div class="wrap">
    <div class="subpage-top">
      <div>
        <h1>Chat</h1>
        <p>Open rooms. Make your own and it is there for anyone who opens it.</p>
      </div>
      <a class="btn" href="forum.html"><svg class="ico"><use href="#i-forum"/></svg>Go to the forum</a>
    </div>

    <div id="mode-banner"></div>

    <!-- Rooms -->
    <div id="rooms-view">
      <form class="composer" id="new-room" autocomplete="off">
        <h2>Make a room</h2>
        <label class="field"><span>Your name</span><input id="nr-name" maxlength="28" required placeholder="How you show up"></label>
        <label class="field"><span>Room name</span><input id="nr-title" maxlength="40" required placeholder="e.g. claude-code"></label>
        <div class="composer-row">
          <button class="btn btn-primary" type="submit" id="nr-submit">Create room<svg class="ico"><use href="#i-send"/></svg></button>
          <span class="hint" id="nr-hint"></span>
        </div>
      </form>

      <ul class="room-list" id="rooms"></ul>
      <div class="empty-state" id="rooms-empty" hidden>No rooms yet. Make the first one.</div>
    </div>

    <!-- Room -->
    <div id="room-view" hidden>
      <a class="back-link" href="chat.html"><svg class="ico"><use href="#i-left"/></svg>All rooms</a>
      <div class="subpage-top" style="margin-bottom:14px">
        <div>
          <h1 id="r-title"></h1>
          <p class="mono" id="r-meta"></p>
        </div>
      </div>
      <div class="room-feed" id="feed"></div>
      <form class="chat-form" id="send" autocomplete="off">
        <input id="msg" maxlength="1000" placeholder="Message the room…" aria-label="Message" required>
        <button class="btn btn-primary" type="submit" id="send-btn"><svg class="ico"><use href="#i-send"/></svg>Send</button>
      </form>
      <p class="mono" id="chat-hint" style="margin-top:10px;color:var(--dim);font-size:.6875rem"></p>
    </div>
  </div>
</main>
